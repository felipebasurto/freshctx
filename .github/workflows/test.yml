name: test

on:
  push:
  pull_request:

jobs:
  official-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run check
      - run: npm test
      - run: npm run pack:check
      - run: npm run bench:layer-a
      - run: npm run bench:mva
      - run: npm run bench:econ
      - run: npm run bench:horizon
      - run: npm run bench:addon
      - run: npm run bench:announce
