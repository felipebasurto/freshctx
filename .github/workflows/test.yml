name: test

on:
  push:
  pull_request:

jobs:
  official-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run check
      - run: npm test
      - run: npm run pack:check
  pi-bridge:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bridges/pi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run check
      - run: npm test
        env:
          PI_OFFLINE: '1'
