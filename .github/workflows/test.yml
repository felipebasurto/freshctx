name: test

on:
  push:
  pull_request:

jobs:
  official-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm run check
      - run: npm test
      - run: npm run pack:check
  pi-bridge:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bridges/pi
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22.19.0"
      - run: npm ci
      - run: npm run check
      - run: npm test
  openhands-bridge:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bridges/openhands
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npm run check
      - run: npm test
